<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Sherlock Skill — public social footprint and behavioral profile</title>
  <desc id="desc">One username leads to a map of public social accounts, evidence-checked identity links, and a behavioral profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1b31"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d9a9"/>
      <stop offset="1" stop-color="#63a4ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38d9a9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38d9a9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b8c7da" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="150" cy="40" r="260" fill="url(#glow)"/>
  <circle cx="1170" cy="620" r="300" fill="url(#glow)" opacity="0.55"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="74" y="76" fill="#38d9a9" font-size="18" font-weight="700" letter-spacing="3.2">PUBLIC SOCIAL FOOTPRINT RESEARCH FOR AI AGENTS</text>

    <text x="72" y="168" fill="#f7fbff" font-size="72" font-weight="750" letter-spacing="-2.4">Sherlock Skill</text>
    <text x="74" y="235" fill="#c8d5e5" font-size="34" font-weight="400">One username.</text>
    <text x="74" y="278" fill="#c8d5e5" font-size="34" font-weight="400">A public social footprint.</text>
    <text x="74" y="316" fill="#7891a9" font-size="20" font-weight="500">Evidence-checked connections and a behavioral profile.</text>

    <rect x="74" y="344" width="648" height="62" rx="12" fill="#071421" stroke="#24425f"/>
    <text x="98" y="383" fill="#7de2c0" font-family="Consolas, monospace" font-size="23" font-weight="700">same handle</text>
    <text x="290" y="384" fill="#7f94ab" font-family="Segoe UI, Arial, sans-serif" font-size="25">≠</text>
    <text x="328" y="383" fill="#8ab7ff" font-family="Consolas, monospace" font-size="23" font-weight="700">same person</text>
    <text x="548" y="383" fill="#6f8aa4" font-size="16" font-weight="600">evidence first</text>

    <g font-size="16" font-weight="700">
      <rect x="74" y="431" width="190" height="44" rx="22" fill="#0d2435" stroke="#2b6c61"/>
      <text x="105" y="459" fill="#8ce8ca">Discover accounts</text>
      <rect x="278" y="431" width="205" height="44" rx="22" fill="#0d2435" stroke="#315b86"/>
      <text x="306" y="459" fill="#9bc6ff">Test connections</text>
      <rect x="497" y="431" width="225" height="44" rx="22" fill="#0d2435" stroke="#405477"/>
      <text x="528" y="459" fill="#c4d2e9">Profile behavior</text>
    </g>

    <text x="74" y="570" fill="#7f94ab" font-size="18" font-weight="500">github.com/milddrunker/sherlock-skill</text>
    <text x="74" y="602" fill="#526b83" font-size="15">MIT licensed  •  Python 3.10+  •  zero runtime dependencies</text>

    <g transform="translate(730 72)" filter="url(#shadow)">
      <rect width="470" height="496" rx="22" fill="#091727" stroke="#28435e"/>
      <rect x="0" y="0" width="470" height="58" rx="22" fill="#0f2438"/>
      <rect x="0" y="36" width="470" height="22" fill="#0f2438"/>
      <circle cx="28" cy="29" r="6" fill="#38d9a9"/>
      <text x="46" y="36" fill="#dce9f7" font-size="16" font-weight="700">PUBLIC ACCOUNT MAP</text>
      <text x="359" y="36" fill="#7de2c0" font-family="Consolas, monospace" font-size="13" font-weight="700">EVIDENCE CHECKED</text>

      <text x="24" y="93" fill="#7891a9" font-size="13" font-weight="700" letter-spacing="1.5">SOCIAL FOOTPRINT</text>
      <line x1="24" y1="108" x2="446" y2="108" stroke="#223b53"/>

      <g stroke-linecap="round" fill="none">
        <path d="M168 145 C192 158 201 174 199 183" stroke="#38d9a9" stroke-width="2.2" stroke-opacity="0.8"/>
        <path d="M302 145 C278 158 269 174 271 183" stroke="#63a4ff" stroke-width="2.2" stroke-opacity="0.8"/>
        <path d="M168 267 C192 254 201 238 199 229" stroke="#38d9a9" stroke-width="2.2" stroke-opacity="0.65" stroke-dasharray="7 7"/>
        <path d="M302 267 C278 254 269 238 271 229" stroke="#ffd166" stroke-width="2.2" stroke-opacity="0.75" stroke-dasharray="7 7"/>
      </g>

      <g>
        <rect x="20" y="117" width="148" height="56" rx="12" fill="#0d2032" stroke="#1d3b55"/>
        <circle cx="42" cy="145" r="10" fill="#38d9a9"/>
        <text x="61" y="141" fill="#ecf5ff" font-size="15" font-weight="700">GitHub</text>
        <text x="61" y="159" fill="#708aa2" font-size="11">public profile</text>

        <rect x="302" y="117" width="148" height="56" rx="12" fill="#0d2032" stroke="#1d3b55"/>
        <circle cx="324" cy="145" r="10" fill="#63a4ff"/>
        <text x="343" y="141" fill="#ecf5ff" font-size="15" font-weight="700">Gitee</text>
        <text x="343" y="159" fill="#708aa2" font-size="11">public profile</text>

        <rect x="20" y="239" width="148" height="56" rx="12" fill="#0d2032" stroke="#1d3b55"/>
        <circle cx="42" cy="267" r="10" fill="#8ce8ca"/>
        <text x="61" y="263" fill="#ecf5ff" font-size="15" font-weight="700">Codeforces</text>
        <text x="61" y="281" fill="#708aa2" font-size="11">possible link</text>

        <rect x="302" y="239" width="148" height="56" rx="12" fill="#0d2032" stroke="#36506a"/>
        <circle cx="324" cy="267" r="10" fill="#ffd166"/>
        <text x="343" y="263" fill="#ecf5ff" font-size="15" font-weight="700">Wattpad</text>
        <text x="343" y="281" fill="#708aa2" font-size="11">unassigned</text>
      </g>

      <g>
        <circle cx="235" cy="206" r="54" fill="#0b302f" stroke="#38d9a9" stroke-width="1.5"/>
        <circle cx="235" cy="206" r="43" fill="#0f3d39"/>
        <circle cx="235" cy="195" r="10" fill="#7de2c0"/>
        <path d="M216 225 C218 211 227 205 235 205 C243 205 252 211 254 225" fill="#7de2c0"/>
        <text x="235" y="283" text-anchor="middle" fill="#8ce8ca" font-size="13" font-weight="700" letter-spacing="1">PROFILE CANDIDATE</text>
      </g>

      <text x="24" y="309" fill="#708aa2" font-size="12">Connections stay provisional until the evidence supports them.</text>

      <rect x="20" y="324" width="430" height="140" rx="14" fill="#0b2234" stroke="#24415c"/>
      <text x="38" y="351" fill="#7891a9" font-size="12" font-weight="700" letter-spacing="1.4">BEHAVIOR PROFILE</text>
      <g font-size="13" font-weight="700">
        <rect x="38" y="365" width="190" height="38" rx="9" fill="#102c43" stroke="#294a66"/>
        <text x="54" y="389" fill="#a8c9e8">Interests</text>
        <rect x="242" y="365" width="190" height="38" rx="9" fill="#102c43" stroke="#294a66"/>
        <text x="258" y="389" fill="#a8c9e8">Communities</text>
        <rect x="38" y="411" width="190" height="38" rx="9" fill="#102c43" stroke="#294a66"/>
        <text x="54" y="435" fill="#a8c9e8">Projects</text>
        <rect x="242" y="411" width="190" height="38" rx="9" fill="#102c43" stroke="#294a66"/>
        <text x="258" y="435" fill="#a8c9e8">Activity cadence</text>
      </g>

      <text x="24" y="486" fill="#526b83" font-size="12">Source dates, confidence, and coverage gaps stay attached.</text>
    </g>
  </g>
</svg>
