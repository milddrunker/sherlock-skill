<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Sherlock Skill — comprehensive public social footprint and behavioral profile</title>
  <desc id="desc">A product preview for security research, brand protection, privacy self-audits, and agent builders: one username leads to public social accounts and a behavioral profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1b31"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d9a9"/>
      <stop offset="1" stop-color="#63a4ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38d9a9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38d9a9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b8c7da" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="150" cy="40" r="260" fill="url(#glow)"/>
  <circle cx="1170" cy="620" r="300" fill="url(#glow)" opacity="0.55"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="74" y="76" fill="#38d9a9" font-size="18" font-weight="700" letter-spacing="3.2">PUBLIC-SOURCE SOCIAL FOOTPRINT RESEARCH</text>

    <text x="72" y="168" fill="#f7fbff" font-size="72" font-weight="750" letter-spacing="-2.4">Sherlock Skill</text>
    <text x="74" y="235" fill="#c8d5e5" font-size="34" font-weight="400">One username.</text>
    <text x="74" y="278" fill="#c8d5e5" font-size="34" font-weight="400">A wider public social story.</text>
    <text x="74" y="316" fill="#7891a9" font-size="20" font-weight="500">Find profiles. Connect accounts. Understand behavior.</text>

    <rect x="74" y="344" width="648" height="62" rx="12" fill="#071421" stroke="#24425f"/>
    <text x="98" y="382" fill="#6f8aa4" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.4">BUILT FOR</text>
    <circle cx="191" cy="377" r="4" fill="#38d9a9"/>
    <text x="204" y="383" fill="#7de2c0" font-size="16" font-weight="700">Security research</text>
    <circle cx="363" cy="377" r="4" fill="#63a4ff"/>
    <text x="376" y="383" fill="#9bc6ff" font-size="16" font-weight="700">Brand protection</text>
    <circle cx="540" cy="377" r="4" fill="#ffd166"/>
    <text x="553" y="383" fill="#ffd166" font-size="16" font-weight="700">Privacy self-audit</text>

    <g font-size="15" font-weight="700">
      <rect x="74" y="431" width="190" height="44" rx="22" fill="#0d2435" stroke="#2b6c61"/>
      <text x="105" y="459" fill="#8ce8ca">Social &amp; video</text>
      <rect x="278" y="431" width="205" height="44" rx="22" fill="#0d2435" stroke="#315b86"/>
      <text x="306" y="459" fill="#9bc6ff">Communities &amp; lifestyle</text>
      <rect x="497" y="431" width="225" height="44" rx="22" fill="#0d2435" stroke="#405477"/>
      <text x="528" y="459" fill="#c4d2e9">Interests &amp; behavior</text>
    </g>

    <text x="74" y="570" fill="#7f94ab" font-size="18" font-weight="500">github.com/milddrunker/sherlock-skill</text>
    <text x="74" y="602" fill="#526b83" font-size="15">MIT licensed  •  Python 3.10+  •  zero runtime dependencies</text>

    <g transform="translate(730 72)" filter="url(#shadow)">
      <rect width="470" height="496" rx="22" fill="#091727" stroke="#28435e"/>
      <rect x="0" y="0" width="470" height="58" rx="22" fill="#0f2438"/>
      <rect x="0" y="36" width="470" height="22" fill="#0f2438"/>
      <circle cx="28" cy="29" r="6" fill="#38d9a9"/>
      <text x="46" y="36" fill="#dce9f7" font-size="16" font-weight="700">PUBLIC SOCIAL MAP</text>
      <text x="360" y="36" fill="#7de2c0" font-family="Consolas, monospace" font-size="12" font-weight="700">PUBLIC SOURCES</text>

      <text x="24" y="93" fill="#7891a9" font-size="13" font-weight="700" letter-spacing="1.5">MULTI-PLATFORM FOOTPRINT</text>
      <line x1="24" y1="108" x2="446" y2="108" stroke="#223b53"/>

      <g stroke-linecap="round" fill="none">
        <path d="M150 164 C170 170 186 179 197 184" stroke="#d946ef" stroke-width="2" stroke-opacity="0.75"/>
        <path d="M235 164 L235 167" stroke="#8fb4d9" stroke-width="2" stroke-opacity="0.75"/>
        <path d="M320 164 C300 170 284 179 273 184" stroke="#ff5d73" stroke-width="2" stroke-opacity="0.75"/>
        <path d="M150 246 C170 240 186 231 197 226" stroke="#67e8f9" stroke-width="2" stroke-opacity="0.75" stroke-dasharray="6 5"/>
        <path d="M235 246 L235 243" stroke="#ff8c5a" stroke-width="2" stroke-opacity="0.75"/>
        <path d="M320 246 C300 240 284 231 273 226" stroke="#ff5b6e" stroke-width="2" stroke-opacity="0.75" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="20" y="117" width="130" height="47" rx="11" fill="#0d2032" stroke="#1d3b55"/>
        <circle cx="39" cy="140" r="7" fill="#d946ef"/>
        <text x="52" y="137" fill="#ecf5ff" font-size="12.5" font-weight="700">Instagram</text>
        <text x="52" y="151" fill="#708aa2" font-size="9.5">social</text>

        <rect x="170" y="117" width="130" height="47" rx="11" fill="#0d2032" stroke="#1d3b55"/>
        <circle cx="189" cy="140" r="7" fill="#8fb4d9"/>
        <text x="202" y="137" fill="#ecf5ff" font-size="12.5" font-weight="700">X</text>
        <text x="202" y="151" fill="#708aa2" font-size="9.5">updates</text>

        <rect x="320" y="117" width="130" height="47" rx="11" fill="#0d2032" stroke="#1d3b55"/>
        <circle cx="339" cy="140" r="7" fill="#ff5d73"/>
        <text x="352" y="137" fill="#ecf5ff" font-size="12.5" font-weight="700">YouTube</text>
        <text x="352" y="151" fill="#708aa2" font-size="9.5">video</text>

        <rect x="20" y="246" width="130" height="47" rx="11" fill="#0d2032" stroke="#1d3b55"/>
        <circle cx="39" cy="269" r="7" fill="#67e8f9"/>
        <text x="52" y="266" fill="#ecf5ff" font-size="12.5" font-weight="700">TikTok</text>
        <text x="52" y="280" fill="#708aa2" font-size="9.5">short video</text>

        <rect x="170" y="246" width="130" height="47" rx="11" fill="#0d2032" stroke="#1d3b55"/>
        <circle cx="189" cy="269" r="7" fill="#ff8c5a"/>
        <text x="202" y="266" fill="#ecf5ff" font-size="12.5" font-weight="700">Reddit</text>
        <text x="202" y="280" fill="#708aa2" font-size="9.5">communities</text>

        <rect x="320" y="246" width="130" height="47" rx="11" fill="#0d2032" stroke="#1d3b55"/>
        <circle cx="339" cy="269" r="7" fill="#ff5b6e"/>
        <text x="352" y="266" fill="#ecf5ff" font-size="12.5" font-weight="700">Pinterest</text>
        <text x="352" y="280" fill="#708aa2" font-size="9.5">interests</text>
      </g>

      <g>
        <circle cx="235" cy="205" r="36" fill="#0b302f" stroke="#38d9a9" stroke-width="1.5"/>
        <circle cx="235" cy="205" r="29" fill="#0f3d39"/>
        <circle cx="235" cy="196" r="7" fill="#7de2c0"/>
        <path d="M222 216 C223 207 229 203 235 203 C241 203 247 207 248 216" fill="#7de2c0"/>
        <text x="235" y="230" text-anchor="middle" fill="#8ce8ca" font-size="7.5" font-weight="700" letter-spacing="0.8">PERSON</text>
      </g>

      <text x="24" y="315" fill="#708aa2" font-size="12">Multiple platforms. One evidence-backed view.</text>

      <rect x="20" y="330" width="430" height="128" rx="14" fill="#0b2234" stroke="#24415c"/>
      <text x="38" y="355" fill="#7891a9" font-size="12" font-weight="700" letter-spacing="1.4">BEHAVIOR PROFILE</text>
      <g font-size="13" font-weight="700">
        <rect x="38" y="367" width="190" height="34" rx="8" fill="#102c43" stroke="#294a66"/>
        <text x="54" y="389" fill="#a8c9e8">Interests</text>
        <rect x="242" y="367" width="190" height="34" rx="8" fill="#102c43" stroke="#294a66"/>
        <text x="258" y="389" fill="#a8c9e8">Communities</text>
        <rect x="38" y="408" width="190" height="34" rx="8" fill="#102c43" stroke="#294a66"/>
        <text x="54" y="430" fill="#a8c9e8">Content style</text>
        <rect x="242" y="408" width="190" height="34" rx="8" fill="#102c43" stroke="#294a66"/>
        <text x="258" y="430" fill="#a8c9e8">Activity rhythm</text>
      </g>

      <text x="24" y="486" fill="#526b83" font-size="12">Source dates, confidence, and coverage gaps stay attached.</text>
    </g>
  </g>
</svg>
